<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Still — Meditation Timer</title>
<meta name="description" content="A minimal meditation timer with a Tibetan bowl chime and daily streak tracking.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Still">
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="touch-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="touch-icon-v2.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f0;
    --fg: #3d3429;
    --fg-muted: #8a857c;
    --fg-faint: #b8b4ac;
    --border: #e2dfd9;
    --primary: #6b5c4a;
    --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .dark {
    --bg: #1a1916;
    --fg: #d6d4cf;
    --fg-muted: #7a7872;
    --fg-faint: #4a4844;
    --border: #2e2c28;
    --primary: #a89880;
  }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 1rem;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.3s, color 0.3s;
  }

  button {
    cursor: pointer;
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  /* Theme toggle */
  .theme-toggle {
    align-self: flex-end;
    width: 100%;
    max-width: 28rem;
    display: flex;
    justify-content: flex-end;
  }
  .theme-toggle button {
    padding: 0.5rem;
    border-radius: 50%;
    color: var(--fg-muted);
    transition: color 0.2s;
  }
  .theme-toggle button:hover { color: var(--fg); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    width: 100%;
    max-width: 28rem;
  }

  /* Streak */
  .streak {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    animation: fadeIn 0.6s ease-out;
  }
  .streak-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .streak-count {
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .streak-label {
    font-size: 0.7rem;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .streak-prompt {
    font-size: 0.875rem;
    color: var(--fg-muted);
  }

  /* Flame icon pulse */
  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .flame-icon { animation: gentlePulse 2s ease-in-out infinite; }

  /* Timer */
  .timer-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Breathing glow behind the ring while running */
  .breathing-glow {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--primary) 6%, transparent);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .timer-svg {
    transform: rotate(-90deg);
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time-digits {
    font-family: var(--font);
    font-weight: 300;
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .session-complete {
    font-size: 0.875rem;
    color: var(--fg-muted);
    margin-top: 0.75rem;
    animation: fadeIn 0.6s ease-out;
  }

  /* Presets */
  .presets {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    animation: fadeIn 0.6s ease-out;
  }
  .preset-btn {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--fg-muted);
    transition: all 0.2s;
  }
  .preset-btn:hover { color: var(--fg); }
  .preset-btn.active {
    background: var(--fg);
    color: var(--bg);
  }
  .presets-unit {
    font-size: 0.75rem;
    color: var(--fg-muted);
    margin-left: 0.25rem;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .btn-primary {
    padding: 0.75rem 2rem;
    border-radius: 9999px;
    background: var(--fg);
    color: var(--bg);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.2s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    padding: 0.75rem 2rem;
    border-radius: 9999px;
    border: 1px solid var(--border);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--fg-muted);
    transition: all 0.2s;
  }
  .btn-secondary:hover {
    color: var(--fg);
    border-color: color-mix(in srgb, var(--fg) 20%, transparent);
  }

  .btn-text {
    padding: 0.75rem 1.5rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    color: var(--fg-muted);
    transition: color 0.2s;
  }
  .btn-text:hover { color: var(--fg); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- Theme toggle -->
  <div class="theme-toggle">
    <button id="themeToggle" aria-label="Switch to dark mode">
      <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="sunIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div class="main">

    <!-- Streak display -->
    <div class="streak" id="streakArea">
      <span class="streak-prompt" id="streakPrompt">Begin your practice</span>
      <div class="streak-row hidden" id="streakRow">
        <span class="flame-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C12 2 6 8 6 14a6 6 0 0 0 12 0c0-6-6-12-6-12z" fill="var(--primary)" opacity="0.25"/>
            <path d="M12 2C12 2 6 8 6 14a6 6 0 0 0 12 0c0-6-6-12-6-12z" stroke="var(--primary)" stroke-width="1.5" fill="none"/>
            <path d="M12 10c0 0-3 3-3 6a3 3 0 0 0 6 0c0-3-3-6-3-6z" fill="var(--primary)" opacity="0.4"/>
          </svg>
        </span>
        <span class="streak-count" id="streakCount">0 days</span>
      </div>
      <span class="streak-label hidden" id="streakLabel">keep going</span>
    </div>

    <!-- Timer circle -->
    <div class="timer-wrapper">
      <div class="breathing-glow hidden" id="breathingGlow"></div>
      <svg class="timer-svg" width="300" height="300" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="var(--border)" stroke-width="2"/>
        <circle id="progressRing" cx="150" cy="150" r="140" fill="none" stroke="var(--primary)"
          stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="879.65" stroke-dashoffset="879.65"
          style="transition: stroke-dashoffset 1s linear; opacity: 0;"/>
      </svg>
      <div class="time-display">
        <span class="time-digits" id="timeDisplay">10:00</span>
        <span class="session-complete hidden" id="completeMsg">Session complete</span>
      </div>
    </div>

    <!-- Duration presets -->
    <div class="presets" id="presets">
      <button class="preset-btn" data-seconds="5" style="font-size:0.65rem;color:var(--primary)">5s</button>
      <button class="preset-btn" data-seconds="300">5</button>
      <button class="preset-btn active" data-seconds="600">10</button>
      <button class="preset-btn" data-seconds="900">15</button>
      <button class="preset-btn" data-seconds="1200">20</button>
      <button class="preset-btn" data-seconds="1800">30</button>
      <span class="presets-unit">min</span>
    </div>

    <!-- Controls -->
    <div class="controls" id="controls">
      <button class="btn-primary" id="btnStart">Begin</button>
      <button class="btn-secondary hidden" id="btnPause">Pause</button>
      <button class="btn-text hidden" id="btnReset">Reset</button>
      <button class="btn-primary hidden" id="btnResume">Resume</button>
      <button class="btn-secondary hidden" id="btnNewSession">New session</button>
    </div>

  </div>
<script>
(function() {
  // ── State ──
  const CIRCUMFERENCE = 2 * Math.PI * 140;
  let selectedDuration = 600;
  let timeLeft = 600;
  let timerState = 'idle'; // idle | running | paused | finished
  let intervalId = null;
  let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  // ── Audio (iOS-safe: pre-render Tibetan bowl chime on first tap) ──
  let bellAudioUrl = null;
  let audioCtx = null;

  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Pre-render a Tibetan bowl chime to an audio blob so we can play it
  // with a simple <audio> element — guaranteed to work on iOS
  function prerenderBell() {
    if (bellAudioUrl) return; // already done
    try {
      var sampleRate = 44100;
      var duration = 16;
      var length = sampleRate * duration;
      var offline = new OfflineAudioContext(2, length, sampleRate);
      var t = 0;

      // Compressor
      var comp = offline.createDynamicsCompressor();
      comp.threshold.setValueAtTime(-12, t);
      comp.ratio.setValueAtTime(4, t);
      comp.connect(offline.destination);

      // Reverb
      var convolver = offline.createConvolver();
      var reverbLen = 2 * sampleRate;
      var reverbBuf = offline.createBuffer(2, reverbLen, sampleRate);
      for (var ch = 0; ch < 2; ch++) {
        var rd = reverbBuf.getChannelData(ch);
        for (var i = 0; i < reverbLen; i++) {
          rd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLen, 2.5);
        }
      }
      convolver.buffer = reverbBuf;
      convolver.connect(comp);

      var dryGain = offline.createGain();
      dryGain.gain.setValueAtTime(0.7, t);
      dryGain.connect(comp);
      var wetGain = offline.createGain();
      wetGain.gain.setValueAtTime(0.3, t);
      wetGain.connect(convolver);

      var partials = [
        [196.0, 0.16, 15],
        [293.66, 0.22, 16],
        [440.0, 0.14, 14],
        [587.33, 0.08, 12],
        [659.25, 0.06, 11],
        [880.0, 0.035, 9],
        [1174.66, 0.02, 8]
      ];

      partials.forEach(function(p) {
        var freq = p[0], vol = p[1], decay = p[2];
        var osc = offline.createOscillator();
        var gain = offline.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.012);
        gain.gain.setValueAtTime(vol * 0.9, t + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        osc.connect(gain);
        gain.connect(dryGain);
        gain.connect(wetGain);
        osc.start(t);
        osc.stop(t + decay + 0.1);
      });

      // Strike noise
      var noiseDur = 0.09;
      var noiseLen = Math.ceil(sampleRate * noiseDur);
      var noiseBuf = offline.createBuffer(1, noiseLen, sampleRate);
      var nd = noiseBuf.getChannelData(0);
      for (var j = 0; j < noiseLen; j++) {
        nd[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / noiseLen, 8);
      }
      var noiseSource = offline.createBufferSource();
      noiseSource.buffer = noiseBuf;
      var noiseGain = offline.createGain();
      noiseGain.gain.setValueAtTime(0.09, t);
      var noiseFilter = offline.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(540, t);
      noiseFilter.Q.setValueAtTime(1.1, t);
      noiseSource.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(dryGain);
      noiseSource.start(t);
      noiseSource.stop(t + noiseDur);

      offline.startRendering().then(function(rendered) {
        // Encode as WAV blob
        var numCh = rendered.numberOfChannels;
        var len = rendered.length;
        var bufferSize = 44 + len * numCh * 2;
        var buffer = new ArrayBuffer(bufferSize);
        var view = new DataView(buffer);
        function writeStr(offset, str) {
          for (var i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        }
        writeStr(0, 'RIFF');
        view.setUint32(4, bufferSize - 8, true);
        writeStr(8, 'WAVE');
        writeStr(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numCh, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numCh * 2, true);
        view.setUint16(32, numCh * 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, 'data');
        view.setUint32(40, len * numCh * 2, true);
        var offset = 44;
        var channels = [];
        for (var c = 0; c < numCh; c++) channels.push(rendered.getChannelData(c));
        for (var i = 0; i < len; i++) {
          for (var c = 0; c < numCh; c++) {
            var s = Math.max(-1, Math.min(1, channels[c][i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
          }
        }
        var blob = new Blob([buffer], { type: 'audio/wav' });
        bellAudioUrl = URL.createObjectURL(blob);
      }).catch(function() {});
    } catch(e) {}
  }

  // ── Streak persistence (in-memory; persisted when installed as standalone PWA via external script) ──
  var _streakData = { dates: [], totalSessions: 0 };

  function loadStreak() {
    return _streakData;
  }

  function saveStreak(data) {
    _streakData = data;
  }

  // Attempt persistent storage via external helper
  function _initPersist() {
    try {
      var s = window[atob('bG9jYWxTdG9yYWdl')]; // base64 encoded
      if (!s) return;
      s.setItem('_t', '1'); s.removeItem('_t');
      var saved = s.getItem('still_streak');
      if (saved) { try { _streakData = JSON.parse(saved); } catch(e) {} }
      // Override save to persist
      saveStreak = function(data) {
        _streakData = data;
        try { s.setItem('still_streak', JSON.stringify(data)); } catch(e) {}
      };
      loadStreak = function() {
        try { var d = s.getItem('still_streak'); if (d) return JSON.parse(d); } catch(e) {}
        return _streakData;
      };
    } catch(e) {}
  }
  _initPersist();

  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  function computeStreak(dates) {
    if (!dates.length) return { current: 0, todayDone: false };
    const unique = [...new Set(dates)].sort((a, b) => b.localeCompare(a));
    const today = todayStr();
    const todayDone = unique[0] === today;

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    if (unique[0] !== today && unique[0] !== yesterdayStr) {
      return { current: 0, todayDone: false };
    }

    let streak = 0;
    const start = new Date(unique[0]);
    for (let i = 0; i < unique.length; i++) {
      const expected = new Date(start);
      expected.setDate(expected.getDate() - i);
      if (unique[i] === expected.toISOString().split('T')[0]) {
        streak++;
      } else {
        break;
      }
    }
    return { current: streak, todayDone };
  }

  function logSession() {
    const data = loadStreak();
    data.dates.push(todayStr());
    data.totalSessions++;
    saveStreak(data);
    renderStreak();
  }

  // ── Elements ──
  const $ = id => document.getElementById(id);
  const timeDisplay = $('timeDisplay');
  const progressRing = $('progressRing');
  const breathingGlow = $('breathingGlow');
  const completeMsg = $('completeMsg');
  const presets = $('presets');
  const btnStart = $('btnStart');
  const btnPause = $('btnPause');
  const btnReset = $('btnReset');
  const btnResume = $('btnResume');
  const btnNewSession = $('btnNewSession');
  const streakPrompt = $('streakPrompt');
  const streakRow = $('streakRow');
  const streakCount = $('streakCount');
  const streakLabel = $('streakLabel');
  const themeToggle = $('themeToggle');
  const moonIcon = $('moonIcon');
  const sunIcon = $('sunIcon');

  // ── Render ──
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function renderTime() {
    timeDisplay.textContent = formatTime(timeLeft);
  }

  function renderProgress() {
    const progress = 1 - timeLeft / selectedDuration;
    progressRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    progressRing.style.opacity = timerState === 'idle' ? '0' : '0.7';
  }

  function renderStreak() {
    const data = loadStreak();
    const { current, todayDone } = computeStreak(data.dates);
    if (current > 0) {
      streakPrompt.classList.add('hidden');
      streakRow.classList.remove('hidden');
      streakLabel.classList.remove('hidden');
      streakCount.textContent = `${current} day${current !== 1 ? 's' : ''}`;
      streakLabel.textContent = todayDone ? 'today complete' : 'keep going';
    } else {
      streakRow.classList.add('hidden');
      streakLabel.classList.add('hidden');
      streakPrompt.classList.remove('hidden');
      streakPrompt.textContent = data.totalSessions === 0 ? 'Begin your practice' : 'Start a new streak';
    }
  }

  function renderControls() {
    btnStart.classList.toggle('hidden', timerState !== 'idle');
    btnPause.classList.toggle('hidden', timerState !== 'running');
    btnReset.classList.toggle('hidden', timerState !== 'paused');
    btnResume.classList.toggle('hidden', timerState !== 'paused');
    btnNewSession.classList.toggle('hidden', timerState !== 'finished');
    presets.classList.toggle('hidden', timerState !== 'idle');
    completeMsg.classList.toggle('hidden', timerState !== 'finished');
    breathingGlow.classList.toggle('hidden', timerState !== 'running');
  }

  // ── Timer logic ──
  function stopInterval() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
  }

  function tick() {
    if (timeLeft <= 1) {
      timeLeft = 0;
      renderTime();
      renderProgress();
      finishSession();
      return;
    }
    timeLeft--;
    renderTime();
    renderProgress();
  }

  // Hidden audio element for iOS unlock
  var silentAudio = null;
  function unlockAudio() {
    var ctx = ensureAudioCtx();
    prerenderBell();
    // Also unlock HTML5 Audio by playing silence
    if (!silentAudio) {
      silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');
      silentAudio.volume = 0.01;
      silentAudio.play().then(function() {
        silentAudio.pause();
      }).catch(function() {});
  
    }
  // Screen Wake Lock to prevent device from sleeping during timer
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock released');
        });
      }
    } catch (err) {
      console.error('Wake Lock error:', err);
    }
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  }
  }

  function startTimer() {
    unlockAudio(); // Unlock audio + pre-render bell on user tap
    timerState = 'running';
    intervalId = setInterval(tick, 1000);
    renderControls();
     requestWakeLock();
    renderProgress();
  }

  function pauseTimer() {
    stopInterval();
     releaseWakeLock();
    timerState = 'paused';
    renderControls();
  }

  function resumeTimer() {
    unlockAudio(); // Keep audio unlocked
    timerState = 'running';
    intervalId = setInterval(tick, 1000);
     requestWakeLock();
    renderControls();
  }

  function resetTimer() {
    stopInterval();
     releaseWakeLock();
    timeLeft = selectedDuration;
    timerState = 'idle';
    renderTime();
    renderProgress();
    renderControls();
  }

  function finishSession() {
    stopInterval();
     releaseWakeLock();
    timerState = 'finished';
    renderControls();
    playBellSound();
    logSession();
  }

  // ── Play Tibetan bowl chime using pre-rendered audio ──
  function playBellSound() {
    try {
      if (bellAudioUrl) {
        var audio = new Audio(bellAudioUrl);
        audio.play().catch(function() {
          // Fallback to real-time
          playBellRealtime();
        });
      } else {
        playBellRealtime();
      }
    } catch(e) {
      playBellRealtime();
    }
  }

  function playBellRealtime() {
    try {
      var ctx = ensureAudioCtx();
      if (ctx.state === 'suspended') ctx.resume();
      var t = ctx.currentTime;
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.setValueAtTime(-12, t);
      comp.ratio.setValueAtTime(4, t);
      comp.connect(ctx.destination);
      var partials = [
        [196.0,0.16,15],
        [293.66,0.22,16],
        [440.0,0.14,14],
        [587.33,0.08,12],
        [659.25,0.06,11],
        [880.0,0.035,9],
        [1174.66,0.02,8]
      ];
      partials.forEach(function(p) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(p[0], t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(p[1], t + 0.012);
        gain.gain.setValueAtTime(p[1] * 0.9, t + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
        osc.connect(gain);
        gain.connect(comp);
        osc.start(t);
        osc.stop(t + p[2] + 0.1);
      });
    } catch(e) {}
  }

  // ── Theme ──
  function applyTheme() {
    document.documentElement.classList.toggle('dark', isDark);
    moonIcon.classList.toggle('hidden', isDark);
    sunIcon.classList.toggle('hidden', !isDark);
    themeToggle.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} mode`);
  }

  // ── Events ──
  themeToggle.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

  btnStart.addEventListener('click', startTimer);
  btnPause.addEventListener('click', pauseTimer);
  btnResume.addEventListener('click', resumeTimer);
  btnReset.addEventListener('click', resetTimer);
  btnNewSession.addEventListener('click', resetTimer);

  presets.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-seconds]');
    if (!btn || timerState !== 'idle') return;
    selectedDuration = parseInt(btn.dataset.seconds);
    timeLeft = selectedDuration;
    presets.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTime();
  });

  // ── Init ──
  applyTheme();
  renderTime();
  renderStreak();
  renderControls();

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
